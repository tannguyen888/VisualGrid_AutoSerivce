spring:
  application:
    name: cardiag-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/cardiag
    username: postgres
    # password is NOT set here - see application.properties (gitignored, local secrets)
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081

jwt:
  # secret is NOT set here - see application.properties (gitignored, local secrets)
  expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

carapi:
  base-url: https://carapi.app
  sync:
    batch-size: 200
    on-startup: false

# ai.api-key / ai.backend-api-key are NOT set here - see application.properties (gitignored, local secrets)

