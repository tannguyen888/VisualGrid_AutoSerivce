spring:
  application:
    name: cardiag-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/cardiag
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: c3VwZXItc2VjcmV0LWtleS1mb3ItY2FyZGlhZy1qd3QtdG9rZW4ta2V5LTEyMzQ1Ng==
  expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
